<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sin conexión — Inventario A/B</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
    margin: 0 0 24px;
    max-width: 320px;
  }
  button {
    background: #f8fafc;
    color: #0f172a;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📦</div>
    <h1>Sin conexión</h1>
    <p>No se pudo cargar esta pantalla del Inventario A/B. Revisa tu conexión e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
